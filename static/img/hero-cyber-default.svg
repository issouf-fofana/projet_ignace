  <g fill="#F5760A">
    <circle cx="100" cy="700" r="5"/>
    <circle cx="300" cy="700" r="3.5"/>
    <circle cx="560" cy="660" r="4"/>
    <circle cx="900" cy="620" r="5"/>
    <circle cx="1500" cy="200" r="5"/>
    <circle cx="1300" cy="200" r="3.5"/>
    <circle cx="1000" cy="240" r="4"/>
    <circle cx="700" cy="280" r="5"/>
    <circle cx="1450" cy="750" r="4"/>
    <circle cx="900" cy="710" r="3.5"/>
    <circle cx="150" cy="150" r="4"/>
    <circle cx="700" cy="190" r="3.5"/>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" fill="none">
    <circle cx="1200" cy="450" r="220"/>
