<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1D3D"/>
      <stop offset="100%" stop-color="#132a5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#F5760A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F5760A" stop-opacity="0"/>
