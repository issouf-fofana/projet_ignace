{% extends "base.html" %}
{% block title %}{{ doc.title }} - {{ settings.brand_name }}{% endblock %}
{% block content %}

<section class="section reveal" style="border-bottom:none">
  <div class="wrap">
    <a href="{{ url_for('public.documents') }}" class="item-more" style="display:inline-block;margin-bottom:16px">← Retour aux documents</a>
    <h2>{{ doc.title }}</h2>
    {% if doc.description %}
      <p class="lead">{{ doc.description }}</p>
    {% endif %}

    <div class="pdf-viewer">
      <iframe src="{{ url_for('public.view_document', doc_id=doc.id) }}" title="{{ doc.title }}"></iframe>
    </div>
  </div>
</section>

{% endblock %}
